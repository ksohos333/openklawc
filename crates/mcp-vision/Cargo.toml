[package]
name = "mcp-vision"
version = "0.2.0"
edition = "2021"
authors = ["bpoppa12"]
license = "MIT"

[[bin]]
name = "mcp-vision"
path = "src/main.rs"

[dependencies]
okc-mcp = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
base64 = "0.22"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
transcribe-cpp = { version = "0.4.1", default-features = false, features = ["vulkan"] }
rubato = "0.16"
rodio = { version = "0.23", default-features = false, features = ["flac", "mp3", "vorbis", "wav", "mp4"] }
dirs.workspace = true
futures-util = "0.3.34"
