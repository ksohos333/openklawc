[package]
name = "openklawc"
version = "0.1.0"
edition = "2021"
description = "A personal Rust TUI for an LLM agent, talking to local MCP servers."
license = "MIT"
authors = ["bpoppa12"]

[dependencies]
ratatui = "0.27"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
glob = "0.3"
shellexpand = "3.1.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
