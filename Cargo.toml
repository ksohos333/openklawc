[workspace]
members = [
    "crates/okc-core",
    "crates/okc-config",
    "crates/okc-llm",
    "crates/okc-mcp",
    "crates/okc-tool",
    "crates/okc-tui",
    "crates/okc-session",
    "crates/okc-reasoning",
    "crates/okc-decision",
    "crates/okc-rag",
    "crates/okc-git",
    "crates/okc-plugin",
    "crates/okc-app",
    "crates/mcp-web-research",
    "crates/mcp-anticonf",
    "crates/mcp-legal-research",
    "crates/mcp-filesystem",
    "crates/mcp-brave-search",
    "crates/mcp-local-brain",
    "crates/mcp-vision",
    "crates/mcp-laya",
    "crates/mcp-playwright",
    "crates/openklawc",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["bpoppa12"]
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
# Async
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
async-trait = "0.1"

# Error handling
anyhow = "1"
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP / API
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "gzip", "multipart"] }
eventsource-stream = "0.2"
bytes = "1"

# TUI
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
unicode-segmentation = "1"

# Internal
okc-core = { path = "crates/okc-core" }
okc-config = { path = "crates/okc-config" }
okc-llm = { path = "crates/okc-llm" }
okc-mcp = { path = "crates/okc-mcp" }
okc-tool = { path = "crates/okc-tool" }
okc-tui = { path = "crates/okc-tui" }
okc-session = { path = "crates/okc-session" }
okc-reasoning = { path = "crates/okc-reasoning" }
okc-decision = { path = "crates/okc-decision" }
okc-rag = { path = "crates/okc-rag" }
okc-git = { path = "crates/okc-git" }
okc-plugin = { path = "crates/okc-plugin" }
okc-app = { path = "crates/okc-app" }

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
glob = "0.3"
shellexpand = "3.1"
dirs = "6"
walkdir = "2"
indexmap = "2"
parking_lot = "0.12"
dashmap = "6"
strum = { version = "0.26", features = ["derive"] }

# Database
rusqlite = { version = "0.33", features = ["bundled", "chrono"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
